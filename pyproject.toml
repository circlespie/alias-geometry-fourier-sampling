[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alias-geometry-fourier-sampling"
version = "1.0.0"
description = "Verification companion for Alias Geometry and Density Compensation in Perturbed Fourier Sampling"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.13.1", "sympy==1.14.0", "matplotlib==3.10.3", "pytest==8.4.2"]
license = {text = "MIT"}
authors = [{name = "Erli Wind-Andersen", email = "erli.wind-andersen@mssm.edu"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
